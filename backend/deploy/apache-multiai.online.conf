# /etc/apache2/sites-available/multiai.online.conf
#
#   sudo a2enmod ssl proxy proxy_http headers expires deflate http2
#   sudo a2ensite multiai.online
#   sudo certbot --apache -d multiai.online -d www.multiai.online
#   sudo apachectl configtest && sudo systemctl reload apache2
#
# Two things live behind one hostname:
#   /        → static site in /var/www/multiai.online (index.html + assets)
#   /api     → Flask backend on 127.0.0.1:30303
#
# The backend mounts itself at /api (server.url_prefix in config.json), so the
# path is passed through unchanged rather than stripped.

<VirtualHost *:80>
    ServerName multiai.online
    ServerAlias www.multiai.online
    Redirect permanent / https://multiai.online/
</VirtualHost>

<VirtualHost *:443>
    ServerName www.multiai.online
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/multiai.online/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/multiai.online/privkey.pem
    Redirect permanent / https://multiai.online/
</VirtualHost>

<VirtualHost *:443>
    ServerName multiai.online
    DocumentRoot /var/www/multiai.online

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/multiai.online/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/multiai.online/privkey.pem

    Protocols h2 http/1.1

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Must be at least limits.max_upload_bytes in config.json, or Apache
    # rejects the upload before Flask ever sees it (413, with no useful body).
    LimitRequestBody 10485760
    RequestHeader set X-Forwarded-Proto "https"

    <Directory /var/www/multiai.online>
        Require all granted
        Options -Indexes
        AllowOverride All
        DirectoryIndex index.html
    </Directory>

    ProxyPreserveHost On
    ProxyTimeout 1800

    # ---- server-sent events ---------------------------------------------
    # The debate streams turn by turn. mod_deflate buffers the stream and makes
    # the page look frozen until the debate ends, so gzip is off here and the
    # read timeout covers a long multi-round discussion.
    # This block must come before the general /api rule; first match wins.
    <Location /api/v1/discussions>
        ProxyPass        http://127.0.0.1:30303/api/v1/discussions timeout=1800 flushpackets=on
        ProxyPassReverse http://127.0.0.1:30303/api/v1/discussions
        SetEnv no-gzip 1
        SetEnv dont-vary 1
    </Location>

    <Location /api/discussions>
        ProxyPass        http://127.0.0.1:30303/api/discussions timeout=1800 flushpackets=on
        ProxyPassReverse http://127.0.0.1:30303/api/discussions
        SetEnv no-gzip 1
        SetEnv dont-vary 1
    </Location>

    # ---- everything else under /api goes to the backend ------------------
    ProxyPass        /api http://127.0.0.1:30303/api timeout=300 keepalive=On
    ProxyPassReverse /api http://127.0.0.1:30303/api

    # Anything not matched above is served from DocumentRoot.

    ErrorLog  ${APACHE_LOG_DIR}/multiai-error.log
    CustomLog ${APACHE_LOG_DIR}/multiai-access.log combined
</VirtualHost>
