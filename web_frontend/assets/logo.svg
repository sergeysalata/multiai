<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="multiai">
  <title>multiai</title>
  <!-- Three voices in one room, each shorter than the last: the panel speaks
       in sequence, and each speaker reads everything said before it. -->
  <rect width="240" height="240" rx="48" fill="#172033"/>
  <rect x="54"  y="66"  width="26" height="123" rx="13" fill="#4B47D6"/>
  <rect x="107" y="90"  width="26" height="99"  rx="13" fill="#17A08C"/>
  <rect x="160" y="114" width="26" height="75"  rx="13" fill="#C9573C"/>
</svg>
